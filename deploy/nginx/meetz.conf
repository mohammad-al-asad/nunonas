# Install: sudo cp deploy/nginx/meetz.conf /etc/nginx/sites-available/meetz
#          sudo ln -sf /etc/nginx/sites-available/meetz /etc/nginx/sites-enabled/meetz
# Then run certbot --nginx, which adds the HTTPS listeners and redirects to this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.meetz4u.xyz;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/meetz-proxy.conf;
    }
}

server {
    listen 80;
    server_name admin.meetz4u.xyz;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/meetz-proxy.conf;
    }
}

server {
    listen 80;
    server_name provider.meetz4u.xyz;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/meetz-proxy.conf;
    }
}

server {
    listen 80;
    server_name meetz4u.xyz www.meetz4u.xyz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/meetz-proxy.conf;
    }
}
